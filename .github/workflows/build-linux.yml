name: Build Linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow and combines both platforms into one package
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        type: string
        required: false
        default: ''

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib g++-multilib make m4 python3 python-is-python3 zip

      - name: Build full package
        run: make pkg

      - name: Locate artifacts
        id: find_artifacts
        run: |
          SO=build/game/qagame.mp.i386.so
          TAR=$(ls build/jaymod-*.tar.gz)
          echo "so=$SO" >> "$GITHUB_OUTPUT"
          echo "tar=$TAR" >> "$GITHUB_OUTPUT"
          ls -lh "$SO" "$TAR"

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux
          path: |
            ${{ steps.find_artifacts.outputs.so }}
            ${{ steps.find_artifacts.outputs.tar }}
